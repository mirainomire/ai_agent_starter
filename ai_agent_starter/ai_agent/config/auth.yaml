# config/auth.yaml
# Login base URL. Leave unset so the auth client follows API_BASE_URL (or
# agent.yaml base_url) like the main request client. Set AUTH_BASE_URL in the
# environment only when the login host must differ from the API host.
# base_url: "http://127.0.0.1:8000/api/"

roles:
  Admin_HC:
    policy_role: Admin
    account_label: admin
    login_endpoint: /auth/login/  # BYE BAC (Django APPEND_SLASH) requires trailing slash
    user_field: "username"  # BYE BAC LoginRequest schema uses `username`
    # Credentials are required from ADMIN_USERNAME/ADMIN_PASSWORD at runtime.

  Employee:
    policy_role: Employee
    account_label: employee1
    login_endpoint: /auth/login/
    user_field: "username"
    # Credentials are required from EMPLOYEE_USERNAME/EMPLOYEE_PASSWORD.

  # Tambah test users
  Employee_2:  # for IDOR testing
    policy_role: Employee
    account_label: employee2
    login_endpoint: /auth/login/
    user_field: "username"
    # Credentials are required from EMPLOYEE_2_USERNAME/EMPLOYEE_2_PASSWORD.

# Token settings
token:
  type: "Bearer"  # or "JWT"
  header: "Authorization"
  token_json_path: "access"  # BYE BAC returns the JWT in the `access` field
  refresh_endpoint: /auth/refresh
  cache_enabled: true
  cache_ttl: 3600  # 1 jam
